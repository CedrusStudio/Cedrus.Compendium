name: Mobile UI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-stories:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build:storybook
      - run: npm run test:storybook
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: health-form-screenshot-diffs
          path: test-results/
          retention-days: 14

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_CONNECTION_STRING: mongodb://127.0.0.1:1/cedrus_mobile_layout_test?serverSelectionTimeoutMS=200&connectTimeoutMS=200
          NEXT_API_KEYS: mobile-e2e-fixture
      - run: node scripts/run-e2e.mjs --project=phone-320 --project=desktop --project=webkit
        env:
          E2E_PRODUCTION: '1'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
