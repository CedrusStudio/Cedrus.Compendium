name: Mobile UI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Verify local AI guidance
        run: npm run verify:ai-guidance
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_CONNECTION_STRING: mongodb://127.0.0.1:1/cedrus_mobile_layout_test?serverSelectionTimeoutMS=200&connectTimeoutMS=200
          NEXT_API_KEYS: mobile-e2e-fixture
      - run: node scripts/run-e2e.mjs --project=phone-320 --project=desktop --project=webkit
        env:
          E2E_PRODUCTION: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
